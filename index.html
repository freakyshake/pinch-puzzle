<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <link rel="icon" href="data:," />
    <title>Pinch Puzzle</title>
    <meta
      name="description"
      content="A calm, seated, hands-only VR puzzle: pinch shapes and place them on their glowing match."
    />
    <meta name="theme-color" content="#2b2f3a" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #dcd3e2;
      }
      /* Loading screen: plain HTML so it shows before any script runs. */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 24px;
        text-align: center;
        font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
        color: #2b2f3a;
        background: linear-gradient(#d7cbe1, #cfdae8 55%, #e6dad1);
        transition: opacity 0.4s ease;
      }
      #boot.done {
        opacity: 0;
        pointer-events: none;
      }
      #boot h1 {
        margin: 0;
        font-size: 30px;
        font-weight: 650;
        letter-spacing: 0.03em;
      }
      #boot p {
        margin: 0;
        max-width: 34em;
        font-size: 17px;
        line-height: 1.5;
      }
      #boot .bar {
        width: 160px;
        height: 4px;
        border-radius: 2px;
        overflow: hidden;
        background: rgba(43, 47, 58, 0.15);
      }
      #boot .bar::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: #2b2f3a;
        animation: boot-slide 1.1s ease-in-out infinite alternate;
      }
      #boot.stopped .bar {
        display: none;
      }
      @keyframes boot-slide {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(150%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .bar::after {
          animation: none;
          width: 100%;
          opacity: 0.4;
        }
      }
      /* Start bar on the flat page: one large button into VR. The same button
         exists on the panel in the scene, but that one is small on a flat
         screen. Clicks pass through everything except the button itself. */
      #start {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 18px;
        z-index: 5;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        padding: 0 16px;
        pointer-events: none;
        font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
      }
      #start[hidden] {
        display: none;
      }
      #start p {
        margin: 0;
        padding: 6px 14px;
        border-radius: 14px;
        font-size: 16px;
        line-height: 1.35;
        text-align: center;
        color: #fafaf7;
        background: rgba(28, 29, 32, 0.82);
      }
      #enter-vr {
        pointer-events: auto;
        min-width: 240px;
        min-height: 60px;
        padding: 0 36px;
        border: 3px solid #1c1d20;
        border-radius: 32px;
        font: inherit;
        font-size: 22px;
        font-weight: 700;
        color: #1c1d20;
        background: #f5d90a;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
        cursor: pointer;
      }
      #enter-vr:hover {
        background: #ffe95c;
      }
      #enter-vr:focus-visible {
        outline: 4px solid #fafaf7;
        outline-offset: 3px;
      }
      #enter-vr.no-headset {
        color: #fafaf7;
        background: #565a66;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-live="polite">
      <h1>Pinch Puzzle</h1>
      <p id="boot-text">Loading...</p>
      <div class="bar"></div>
    </div>
    <noscript>
      <style>
        #boot {
          display: none;
        }
      </style>
      <p style="font-family: system-ui, sans-serif; text-align: center; padding: 24px">
        Pinch Puzzle needs JavaScript and WebGL 2. Open it in the Meta Quest Browser.
      </p>
    </noscript>
    <div id="scene-container"></div>
    <div id="start" hidden>
      <p id="start-note">Seated, hands only. Pinch a shape and drop it on its match.</p>
      <button id="enter-vr" type="button">Play in VR</button>
    </div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
